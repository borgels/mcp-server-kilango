# Append one site block per deployed company to your Caddy config.
# Enrollment/health paths go straight to the container loopback port (bypassing the
# gateway Entra auth, since the operator's browser has no gateway token); /mcp goes to
# the gateway. Reload with: caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy

kilango.aaa.mcp.example.com {
	handle /kilango/* {
		reverse_proxy 127.0.0.1:8093
	}
	handle /healthz {
		reverse_proxy 127.0.0.1:8093
	}
	handle {
		reverse_proxy 127.0.0.1:8080
	}
}

kilango.bbb.mcp.example.com {
	handle /kilango/* {
		reverse_proxy 127.0.0.1:8094
	}
	handle /healthz {
		reverse_proxy 127.0.0.1:8094
	}
	handle {
		reverse_proxy 127.0.0.1:8080
	}
}

kilango.ccc.mcp.example.com {
