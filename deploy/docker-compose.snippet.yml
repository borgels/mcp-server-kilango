# Paste these services into ~/mcp/docker-compose.yml on the server (they reuse the shared
# &mcp-service anchor). One instance per company that has a Kilango workspace. The published
# loopback port lets host-Caddy reach /kilango/connect-app + /healthz directly, bypassing the
# gateway Entra auth; /mcp still goes through the gateway.

  mcp-kilango-aaa:
    <<: *mcp-service
    image: ghcr.io/borgels/mcp-server-kilango:latest
    container_name: mcp-kilango-aaa
    env_file: [env/internal.env, env/kilango-aaa.env]
    ports:
      - "127.0.0.1:8093:3000"
    volumes:
      - ./audit/kilango-aaa:/data

  mcp-kilango-bbb:
    <<: *mcp-service
    image: ghcr.io/borgels/mcp-server-kilango:latest
    container_name: mcp-kilango-bbb
    env_file: [env/internal.env, env/kilango-bbb.env]
    ports:
      - "127.0.0.1:8094:3000"
    volumes:
      - ./audit/kilango-bbb:/data

  mcp-kilango-ccc:
    <<: *mcp-service
    image: ghcr.io/borgels/mcp-server-kilango:latest
    container_name: mcp-kilango-ccc
    env_file: [env/internal.env, env/kilango-ccc.env]
    ports:
      - "127.0.0.1:8095:3000"
    volumes:
      - ./audit/kilango-ccc:/data
